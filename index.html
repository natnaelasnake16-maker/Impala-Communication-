<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Impala Communication | Strategic Communications, Campaigns &amp; Media Production in Ethiopia and Africa</title>
    <meta
      name="description"
      content="Impala Communication helps institutions, businesses, and development organizations shape narratives, lead campaigns, and produce media across Ethiopia and Africa."
    />
    <meta
      name="keywords"
      content="strategic communications Ethiopia, communications consultancy Africa, narrative strategy, campaigns Ethiopia, media production Addis Ababa, institutional positioning Africa, Impala Communication"
    />
    <link rel="canonical" href="https://www.impalacommunication.com/" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="https://raw.githubusercontent.com/natnaelasnake16-maker/impala-communication-images/main/site/branding/impala-logo.png"
    />
    <link
      rel="apple-touch-icon"
      href="https://raw.githubusercontent.com/natnaelasnake16-maker/impala-communication-images/main/site/branding/impala-logo.png"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.impalacommunication.com/" />
    <meta property="og:site_name" content="Impala Communication" />
    <meta
      property="og:title"
      content="Impala Communication | Strategic Communications, Campaigns &amp; Media Production in Ethiopia and Africa"
    />
    <meta
      property="og:description"
      content="Impala Communication helps institutions, businesses, and development organizations shape narratives, lead campaigns, and produce media across Ethiopia and Africa."
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/natnaelasnake16-maker/impala-communication-images/main/site/branding/impala-logo.png"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@impalacommunication" />
    <meta
      name="twitter:title"
      content="Impala Communication | Strategic Communications, Campaigns &amp; Media Production in Ethiopia and Africa"
    />
    <meta
      name="twitter:description"
      content="Impala Communication helps institutions, businesses, and development organizations shape narratives, lead campaigns, and produce media across Ethiopia and Africa."
    />
    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/natnaelasnake16-maker/impala-communication-images/main/site/branding/impala-logo.png"
    />

    <!-- Robots -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Geo targeting -->
    <meta name="geo.region" content="ET-AA" />
    <meta name="geo.placename" content="Addis Ababa" />

    <!-- Structured Data: WebSite + Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://www.impalacommunication.com/#website",
          "url": "https://www.impalacommunication.com/",
          "name": "Impala Communication",
          "alternateName": "Impala Communications",
          "description": "Strategic communications consultancy, campaigns, and media production for institutions shaping Ethiopia and Africa.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.impalacommunication.com/?s={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://www.impalacommunication.com/#organization",
          "name": "Impala Communication",
          "alternateName": "Impala Communications",
          "url": "https://www.impalacommunication.com/",
          "logo": {
            "@type": "ImageObject",
            "@id": "https://www.impalacommunication.com/#logo",
            "url": "https://raw.githubusercontent.com/natnaelasnake16-maker/impala-communication-images/main/site/branding/impala-logo.png",
            "caption": "Impala Communication"
          },
          "image": {
            "@id": "https://www.impalacommunication.com/#logo"
          },
          "description": "Impala Communication is a strategic communications consultancy helping institutions, businesses, and development organizations shape narratives, lead campaigns, and produce media across Ethiopia and Africa. Founded in 2016.",
          "foundingDate": "2016",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Addis Ababa",
            "addressRegion": "Addis Ababa",
            "addressCountry": "ET"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "info@impalacommunication.com",
            "contactType": "customer service",
            "availableLanguage": ["English", "Amharic"]
          },
          "sameAs": [
            "https://www.linkedin.com/company/impala-communication/",
            "https://www.youtube.com/user/terusew1"
          ],
          "knowsAbout": [
            "Strategic Communications",
            "Narrative Strategy",
            "Institutional Positioning",
            "Media Production",
            "Campaigns",
            "Africa Communications",
            "Ethiopia Communications",
            "Development Communications",
            "Stakeholder Engagement"
          ]
        }
      ]
    }
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
